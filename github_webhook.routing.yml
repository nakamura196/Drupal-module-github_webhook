# github_webhook.routing.yml
github_webhook.trigger:
  path: '/github-webhook/settings'
  defaults:
    _form: '\Drupal\github_webhook\Form\TriggerForm'
    _title: 'Trigger Webhook'
  requirements:
    _permission: 'trigger github webhook'

github_webhook.repositories:
  path: '/github-webhook/settings/repositories'
  defaults:
    _form: '\Drupal\github_webhook\Form\SettingsForm'
    _title: 'Repositories'
  requirements:
    _permission: 'administer github webhook'

github_webhook.auto_trigger:
  path: '/github-webhook/settings/auto-trigger'
  defaults:
    _form: '\Drupal\github_webhook\Form\AutoTriggerForm'
    _title: 'Auto Trigger'
  requirements:
    _permission: 'administer github webhook'

github_webhook.status:
  path: '/github-webhook/api/status/{repo_index}'
  defaults:
    _controller: '\Drupal\github_webhook\Controller\StatusController::getStatus'
  requirements:
    _permission: 'trigger github webhook'
    repo_index: '\d+'
  options:
    no_cache: TRUE

github_webhook.trigger_api:
  path: '/github-webhook/api/trigger/{repo_index}'
  defaults:
    _controller: '\Drupal\github_webhook\Controller\StatusController::trigger'
  requirements:
    _permission: 'trigger github webhook'
    repo_index: '\d+'
  methods: [POST]
  options:
    no_cache: TRUE

github_webhook.cancel_api:
  path: '/github-webhook/api/cancel/{repo_index}/{run_id}'
  defaults:
    _controller: '\Drupal\github_webhook\Controller\StatusController::cancel'
  requirements:
    _permission: 'trigger github webhook'
    repo_index: '\d+'
    run_id: '\d+'
  methods: [POST]
  options:
    no_cache: TRUE
