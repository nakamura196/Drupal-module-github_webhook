deploy_trigger.settings:
  type: config_object
  label: 'Deploy Trigger settings'
  mapping:
    repositories:
      type: sequence
      label: 'Repositories'
      sequence:
        type: mapping
        label: 'Repository'
        mapping:
          label:
            type: string
            label: 'Label'
          owner:
            type: string
            label: 'Owner'
          repo:
            type: string
            label: 'Repository name'
          event_type:
            type: string
            label: 'Event type'
          token_source:
            type: string
            label: 'Token source'
          github_token:
            type: string
            label: 'GitHub token'
          token_key:
            type: string
            label: 'Key module key ID'
          workflow_file:
            type: string
            label: 'Workflow file'
    auto_trigger_enabled:
      type: boolean
      label: 'Auto trigger enabled'
    auto_trigger_content_types:
      type: sequence
      label: 'Auto trigger content types'
      sequence:
        type: string
        label: 'Content type'
    auto_trigger_repositories:
      type: sequence
      label: 'Auto trigger repositories'
      sequence:
        type: integer
        label: 'Repository index'
    vercel_projects:
      type: sequence
      label: 'Vercel projects'
      sequence:
        type: mapping
        label: 'Vercel project'
        mapping:
          label:
            type: string
            label: 'Label'
          deploy_hook_url:
            type: string
            label: 'Deploy Hook URL'
          project_id:
            type: string
            label: 'Vercel project ID'
          token_source:
            type: string
            label: 'Token source'
          vercel_token:
            type: string
            label: 'Vercel API token'
          token_key:
            type: string
            label: 'Key module key ID'
    auto_trigger_vercel_projects:
      type: sequence
      label: 'Auto trigger Vercel projects'
      sequence:
        type: integer
        label: 'Project index'
